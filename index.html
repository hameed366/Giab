<div class="hd"><img id="lg" alt="" hidden><div><h1 id="ttl">📋 إحصائية الغياب اليومي</h1><div class="mu" id="sub"></div></div></div>
<div class="tabs"><button id="t-entry" onclick="T='entry';R()">رصد الغياب</button><button id="t-rep" onclick="T='rep';R()">إحصائية اليوم</button><button id="t-man" onclick="T='man';R()" style="display:none">الإعدادات</button><button id="t-conn" onclick="T='conn';R()">الربط</button><button id="t-out" onclick="logout()">خروج</button></div>

<script>
const GN={'السادس':6,'السابع':7,'الثامن':8,'التاسع':9},NUM=/^[\d٠-٩۰-۹.\s]+$/;
const DEFG=()=>({grades:[['g1','السادس',9],['g2','السابع',8],['g3','الثامن',8],['g4','التاسع',8]].map(a=>({id:a[0],name:a[1],count:a[2]})),locked:false});
let db=1,ready=false,isAdmin=false,canW=true,online=-1,sig='',CFG=null,STU={},ABS={},unsubA=null,T='entry',G=null,K=null,D=td(),pend='',msg='',IMP=null,IS='all',dirty=0,conf={},SEL=new Set(),SM=0,LK=null;

/* ===== طبقة التخزين: Google Sheets (عبر Apps Script) أو وضع محلي ===== */
const DEF_URL='',DEF_TOKEN='';/* يمكنك وضع رابط التطبيق والرمز هنا ليعمل الملف مباشرة لكل المعلمين */
const LS=k=>{try{return localStorage.getItem(k)}catch(e){return null}},LSS=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let URL_=LS('abs_url')!==null?LS('abs_url'):DEF_URL,TOK=LS('abs_tok')!==null?LS('abs_tok'):DEF_TOKEN,ADM=LS('abs_adm')||'';
function loc(){try{return JSON.parse(LS('abs_local'))||{}}catch(e){return{}}}
async function api(body){const r=await fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({token:TOK},body))});const j=await r.json();if(j&&j.error){const e=new Error(j.error);e.code=j.error;throw e}return j}
async function load(){if(URL_)return api({action:'load',date:D});const o=loc(),m={};Object.keys(o.absence||{}).forEach(x=>{if(x.startsWith(D+'|'))m[x.split('|')[1]]=o.absence[x]});return{config:o.config||null,students:o.students||{},absence:m}}
async function put(op){if(URL_)return api(op);const o=loc();if(op.action=='set'){if(op.key=='config')o.config=op.value;else{o.students=o.students||{};o.students[op.key.slice(9)]=op.value.list||[]}}else{o.absence=o.absence||{};o.absence[op.date+'|'+op.key]=op.ids}LSS('abs_local',JSON.stringify(o))}
async function pull(){const d=D;try{const j=await load();if(d!==D)return;let c=busy('cfg')?CFG:(j.config?cl(j.config):null);const m={};Object.keys(j.students||{}).forEach(k=>{m[k]=cl(j.students[k])});for(const k in STU)if(busy('s'+k))m[k]=STU[k];const a={};Object.keys(j.absence||{}).forEach(k=>{a[k.indexOf('@')<0?k+'@1':k]=(j.absence[k]||[]).slice()});for(const k in ABS)if(busy('a'+D+k))a[k]=ABS[k];
const ns=JSON.stringify([c,m,a,j.role,j.grade]);const was=online;online=1;if(ns!==sig||was!==1){sig=ns;setRole(j.role,j.grade);CFG=c;STU=m;ABS=a;dr()}}catch(e){if(e&&e.code=='auth'){TOK='';LSS('abs_tok','');setRole('');GATE=1;sig='';msg='كلمة المرور غير صحيحة أو تم تغييرها، سجّل الدخول من جديد';R();return}if(online!==0){msg='تعذر الاتصال بـ Google Sheets، تحقق من الإنترنت ومن الرابط';online=0;dr()}}}
function isNative(){return !!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())}
function isStandalone(){return !!((window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true||isNative())}
async function saveFile(name,data){const b=data instanceof Blob?data:new Blob([data],{type:/\.html$/i.test(name)?'text/html;charset=utf-8':'application/octet-stream'});
if(isNative()){try{const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)});const P=Capacitor.Plugins,w=await P.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});await P.Share.share({title:name,url:w.uri,dialogTitle:'حفظ أو مشاركة الملف'})}catch(e){msg='تعذر حفظ الملف';R()}return}
const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
function doPrint(){if(isNative()){const html='<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Tahoma,Arial,sans-serif;margin:16px;color:#000}</style></head><body>'+document.getElementById('pr').innerHTML+'</body></html>';saveFile('absence-print-'+D+'.html',html);msg='شارِك الملف ثم افتحه في المتصفح واطبعه';R();return}window.print()}
let INST=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();INST=e;try{R()}catch(x){}});
function instCard(){if(isStandalone())return'';if(INST)return'<div class="card"><b>📲 تثبيت التطبيق</b><div class="mu" style="margin:6px 0">ثبّت الأداة على شاشتك الرئيسية لتفتح كتطبيق.</div><div class="bar"><button class="p" onclick="doInstall()">تثبيت</button></div></div>';if(/iphone|ipad|ipod/i.test(navigator.userAgent))return'<div class="card"><b>📲 تثبيت على الآيفون</b><div class="mu" style="margin-top:6px">في Safari اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».</div></div>';return''}
async function doInstall(){if(!INST)return;INST.prompt();try{await INST.userChoice}catch(e){}INST=null;R()}
async function migrate(){if(!isAdmin)return;const j=await load();if(j.config||Object.keys(j.students||{}).length)return;const o=loc();if(!o.config&&!Object.keys(o.students||{}).length)return;if(o.config)await api({action:'set',key:'config',value:o.config});for(const k in o.students||{})await api({action:'set',key:'students_'+k,value:{list:o.students[k]}});msg+=' — تم نقل بيانات هذا الجهاز إلى الجدول'}
async function saveConn(){const u=nn(document.getElementById('cu').value),t=document.getElementById('ct').value;URL_=u;TOK=t;LSS('abs_url',u);LSS('abs_tok',t);LSS('abs_rem','1');sig='';online=-1;msg='';
if(!u){msg='أدخل رابط تطبيق Google Sheets';R();return}
try{const j=await load();setRole(j.role,j.grade);GATE=0;msg='تم الاتصال بنجاح — الصلاحية: '+RN[ROLE];await migrate()}catch(e){msg=e&&e.code=='auth'?'كلمة المرور غير صحيحة':'تعذر الاتصال بالرابط، تأكد من نشر التطبيق ومن صحة الرابط'}
await pull();R()}
function vConn(){return `<div class="card"><b>الربط مع Google Sheets</b><div class="mu" style="margin:6px 0">${URL_?(online===1?'✅ متصل بالجدول — الصلاحية الحالية: '+(RN[ROLE]||'—'):'⚠️ الرابط محفوظ لكن الاتصال غير ناجح حاليًا.'):'أدخل رابط تطبيق Google Sheets (Apps Script) وكلمة المرور لبدء الاستخدام.'}</div><div class="row"><input id="cu" dir="ltr" placeholder="رابط تطبيق الويب (Apps Script)" value="${esc(URL_)}"></div><div class="row"><input id="ct" dir="ltr" type="password" placeholder="كلمة المرور" value="${esc(TOK)}"></div><div class="bar"><button class="p" onclick="saveConn()">حفظ واختبار الاتصال</button></div><div class="mu">تحدد كلمة المرور الصلاحية: معلم (رصد فقط)، مشرف (رصد وإحصائيات)، مدير (صلاحيات كاملة).</div></div>`}

/* ===== رموز QR للفصول ===== */
let QR=0,GATE=0,LSIG='',ROLE='',PD=0,SUPG='',RG={g:'',from:'',to:'',data:null};const RN={admin:'مدير',sup:'مشرف',teacher:'معلم'};
function setRole(r,g){ROLE=r||'';SUPG=ROLE=='sup'?(g||''):'';isAdmin=ROLE=='admin'}
function canStat(){return ROLE=='admin'||ROLE=='sup'}
function pwCard(){const f=(r,l)=>`<div class="row"><b style="min-width:80px">${l}</b><input id="pw_${r}" type="password" dir="ltr" autocomplete="new-password" placeholder="كلمة مرور جديدة"><button onclick="setPw('${r}')">حفظ</button></div>`;return `<div class="card"><b>🔑 كلمات المرور</b><div class="mu" style="margin:6px 0">غيّر كلمة مرور أي دور. مشرف الصف يستلم صفًا كاملًا فقط (يرصد ويرى إحصائياته). تُحفظ في الخادم، ومن يستخدم الكلمة القديمة يُطلب منه الدخول من جديد. 4 أحرف على الأقل، ويجب أن تكون الكلمات الثلاث مختلفة.</div>${f('teacher','المعلم')}${f('sup','مشرف عام (كل الصفوف)')}${cfg().grades.map(g=>f('sup:'+g.id,'مشرف '+esc(g.name))).join('')}${f('admin','المدير')}</div>`}
async function setPw(r){const v=document.getElementById('pw_'+r).value.trim();if(v.length<4){msg='كلمة المرور قصيرة (4 أحرف على الأقل)';R();return}
try{await api({action:'setpw',target:r,value:v});if(r=='admin'){TOK=v;if(LS('abs_rem')==='1')LSS('abs_tok',v)}msg='تم تغيير كلمة المرور'}catch(e){msg=e&&e.code=='dup'?'هذه الكلمة مستخدمة لدور آخر، اختر كلمة مختلفة':e&&e.code=='admin'?'تغيير كلمات المرور للمدير فقط':'تعذر الحفظ، تحقق من الاتصال وحدّث Code.gs'}R()}

/* ===== الحصص: رصد لكل حصة، سجل الفصل اليومي، كشف الصف حسب الأيام ===== */
function NP(){return Math.max(1,Math.min(12,+cfg().periods||7))}
function SP(){return +cfg().statP===2?2:1}
function ak(k,p){return k+'@'+(p||PD)}
function vg(){return cfg().grades.filter(g=>!SUPG||g.id==SUPG)}
function dl(d){try{return new Date(d+'T12:00:00').toLocaleDateString('ar-KW',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}catch(e){return d}}
function setNP(v){v=Math.max(1,Math.min(12,parseInt(v)||7));mut(c=>{c.periods=v})}
function setSP(v){mut(c=>{c.statP=v==2?2:1})}
function perCard(){return '<div class="card"><b>الحصص اليومية</b><div class="mu" style="margin:6px 0">يختار المعلم الحصة قبل رصد الغياب، ويُسجَّل غياب كل فصل في كل حصة على مدار اليوم. الإحصائية اليومية تُحسب من حصة واحدة يحددها المدير.</div><div class="bar"><span class="mu">عدد الحصص في اليوم</span><input type="number" min="1" max="12" value="'+NP()+'" style="width:84px" onchange="setNP(this.value)"><span class="mu">الإحصائية من</span><select onchange="setSP(this.value)"><option value="1" '+(SP()==1?'selected':'')+'>الحصة الأولى</option><option value="2" '+(SP()==2?'selected':'')+'>الحصة الثانية</option></select></div></div>'}
function pSel(){return '<div class="mu" style="margin:6px 0 4px">الحصة</div><div class="seg">'+[...Array(NP())].map((_,i)=>'<button class="'+(PD==i+1?'on':'')+'" onclick="PD='+(i+1)+';R()">'+(i+1)+'</button>').join('')+'</div>'}
function amOf(date,src){return src?((RG.data||{})[date]||{}):ABS}
function cpData(g,n,am){const k=g.id+'_'+n,L=STU[k]||[],P=NP(),rec=[],ab=[],cnt=[];for(let p=1;p<=P;p++){const r=am[k+'@'+p];rec[p]=!!r;ab[p]=new Set(r||[]);cnt[p]=L.filter(x=>ab[p].has(x.id)).length}
const rows=L.map((x,i)=>({i:i+1,s:x,m:[...Array(P)].map((_,j)=>ab[j+1].has(x.id))})).filter(x=>x.m.some(Boolean));return{k,L,P,rec,cnt,rows}}
