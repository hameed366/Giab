<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام التحضير الذكي عبر السحابة</title>
<style>
:root { --pr: #2563eb; --bg: #f8fafc; --card: #ffffff; --tx: #0f172a; --bd: #e2e8f0; --ab: #ef4444; --ok: #10b981; }
body { margin:0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--tx); font-size: 15px; }
.w { max-width: 900px; margin: 0 auto; padding: 12px; }
.hdr { background: var(--card); padding: 14px; border-radius: 12px; border: 1px solid var(--bd); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
.nav { display: flex; gap: 6px; margin-bottom: 12px; }
.nav button { flex: 1; padding: 10px; border: 1px solid var(--bd); background: var(--card); border-radius: 8px; font-weight: bold; cursor: pointer; }
.nav button.on { background: var(--pr); color: white; border-color: var(--pr); }
.card { background: var(--card); padding: 16px; border-radius: 12px; border: 1px solid var(--bd); margin-bottom: 12px; }
.btn { padding: 8px 14px; border-radius: 8px; border: none; background: var(--pr); color: white; cursor: pointer; font-weight: 500; }
.btn-d { background: var(--ab); }
.btn-ok { background: var(--ok); }
input, select, textarea { width: 100%; padding: 8px; border: 1px solid var(--bd); border-radius: 8px; box-sizing: border-box; margin-top: 4px; margin-bottom: 10px; }
.grid-chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 8px; margin: 10px 0; }
.chip { padding: 10px; border: 1px solid var(--bd); background: var(--bg); border-radius: 8px; text-align: center; cursor: pointer; }
.chip.sel { border-color: var(--pr); background: #eff6ff; font-weight: bold; }
.st-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--bd); }
.st-row.abs { background: #fef2f2; }
.qr-card { text-align: center; border: 1px dashed var(--bd); padding: 12px; border-radius: 8px; display: inline-block; margin: 6px; background:#fff; }
.loader { display:inline-block; border: 3px solid #f3f3f3; border-top: 3px solid var(--pr); border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@media print { .no-print { display: none !important; } .w { max-width: 100%; } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<div class="w">
  <div class="hdr no-print">
    <div>
      <h2 style="margin:0" id="school-title">مدرسة المتوسطة</h2>
      <small style="color:#64748b" id="sync-status">⚡ جاري التحقق من المزامنة السحابية...</small>
    </div>
    <div id="auth-status"><button class="btn" onclick="loginAdmin()">دخول المدير</button></div>
  </div>

  <div class="nav no-print">
    <button id="tb-entry" class="on" onclick="setTab('entry')">رصد الغياب</button>
    <button id="tb-rep" onclick="setTab('rep')">التقرير اليومي</button>
    <button id="tb-qr" onclick="setTab('qr')">أكواد QR للفصول</button>
    <button id="tb-admin" style="display:none" onclick="setTab('admin')">لوحة المدير</button>
  </div>

  <div id="view-area"></div>
</div>

<script>
const DEFAULT_CFG = {
  school: 'المدرسة المتوسطة',
  teacherPass: '1234',
  adminPass: 'admin123',
  gsUrl: '',
  grades: [
    { id: 'g6', name: 'الصف السادس', count: 9 },
    { id: 'g7', name: 'الصف السابع', count: 8 },
    { id: 'g8', name: 'الصف الثامن', count: 8 },
    { id: 'g9', name: 'الصف التاسع', count: 8 }
  ]
};

let CFG = JSON.parse(localStorage.getItem('app_cfg')) || DEFAULT_CFG;
let STU = JSON.parse(localStorage.getItem('app_stu')) || {};
let ABS = JSON.parse(localStorage.getItem('app_abs')) || {};
let isAdmin = false, isTeacherAuth = false, isLoading = false;
let currentTab = 'entry', selectedGrade = 'g6', selectedClass = 1;

function saveState() {
  localStorage.setItem('app_cfg', JSON.stringify(CFG));
  localStorage.setItem('app_stu', JSON.stringify(STU));
  localStorage.setItem('app_abs', JSON.stringify(ABS));
}

function initURLParams() {
  const p = new URLSearchParams(window.location.search);
  if(p.has('g')) selectedGrade = p.get('g');
  if(p.has('c')) selectedClass = parseInt(p.get('c'));
}

// الاتصال بالسحابة لجلب البيانات أولاً
async function fetchFromCloud() {
  if (!CFG.gsUrl) {
    document.getElementById('sync-status').innerText = '⚠️ النظام غير مربوط بـ Google Sheets (عمل محلي)';
    return;
  }
  isLoading = true;
  document.getElementById('sync-status').innerHTML = '<span class="loader"></span> جاري المزامنة مع السحابة...';
  try {
    const res = await fetch(CFG.gsUrl + '?action=get_data');
    const data = await res.json();
    if(data.students) STU = data.students;
    if(data.absence) ABS = data.absence;
    if(data.config) CFG = Object.assign(CFG, data.config);
    saveState();
    document.getElementById('sync-status').innerText = '☁️ متصل ومزامن سحابياً';
  } catch(e) {
    document.getElementById('sync-status').innerText = '❌ تعذر الاتصال بالسحابة (استخدام النسخة المحلية)';
  }
  isLoading = false;
  render();
}

async function saveToCloud(actionType, dataPayload) {
  if (!CFG.gsUrl) return;
  document.getElementById('sync-status').innerHTML = '<span class="loader"></span> جاري الحفظ سحابياً...';
  try {
    await fetch(CFG.gsUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: actionType, payload: dataPayload })
    });
    document.getElementById('sync-status').innerText = '☁️ تم الحفظ بالسحابة بنجاح';
  } catch(e) {
    document.getElementById('sync-status').innerText = '⚠️ فشل الحفظ بالسحابة';
  }
}

function loginAdmin() {
  const p = prompt('أدخل كلمة مرور المدير:');
  if(p === CFG.adminPass) {
    isAdmin = true;
    document.getElementById('auth-status').innerHTML = '<span style="color:green;font-weight:bold">المدير متصل</span>';
    document.getElementById('tb-admin').style.display = 'block';
    render();
  } else if(p) alert('كلمة المرور خاطئة!');
}

function verifyTeacherPass() {
  const p = prompt('أدخل كلمة مرور المعلم لبدء التحضير:');
  if(p === CFG.teacherPass) {
    isTeacherAuth = true;
    render();
  } else if(p) alert('كلمة المرور غير صحيحة!');
}

function toggleAbsence(key, stuId) {
  if(!ABS[key]) ABS[key] = [];
  const idx = ABS[key].indexOf(stuId);
  if(idx > -1) ABS[key].splice(idx, 1);
  else ABS[key].push(stuId);
  
  saveState();
  saveToCloud('save_absence', { key: key, absList: ABS[key], date: new Date().toISOString().split('T')[0] });
  render();
}

function handleExcelUpload(file, targetGradeId) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, {type: 'array'});
    let importedCount = 0;

    workbook.SheetNames.forEach(sheetName => {
      const ws = workbook.Sheets[sheetName];
      const jsonRows = XLSX.utils.sheet_to_json(ws, {header: 1, defval: ''});
      
      let nameColIndex = -1, startRowIndex = -1;
      for (let r = 0; r < jsonRows.length; r++) {
        for (let c = 0; c < jsonRows[r].length; c++) {
          if (String(jsonRows[r][c]).trim() === 'الاسم') {
            nameColIndex = c; startRowIndex = r + 1; break;
          }
        }
        if (nameColIndex !== -1) break;
      }

      if (nameColIndex !== -1) {
        const classNum = parseInt(sheetName) || 1;
        const key = targetGradeId + '_' + classNum;
        STU[key] = [];

        for (let r = startRowIndex; r < jsonRows.length; r++) {
          const nameVal = String(jsonRows[r][nameColIndex] || '').trim();
          if (nameVal && nameVal !== 'nan' && !/^\d+$/.test(nameVal)) {
            STU[key].push({ id: 's_' + Math.random().toString(36).substr(2, 6), name: nameVal });
            importedCount++;
          }
        }
      }
    });

    saveState();
    saveToCloud('save_students', STU);
    alert('تم الاستيراد والحفظ سحابياً بنجاح! الإجمالي: ' + importedCount + ' طالب');
    render();
  };
  reader.readAsArrayBuffer(file);
}

function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('on'));
  document.getElementById('tb-' + tab).classList.add('on');
  render();
}

function render() {
  document.getElementById('school-title').innerText = CFG.school;
  const area = document.getElementById('view-area');

  if (currentTab === 'entry') {
    const gradeObj = CFG.grades.find(g => g.id === selectedGrade) || CFG.grades[0];
    const key = gradeObj.id + '_' + selectedClass;
    const stuList = STU[key] || [];
    const absList = ABS[key] || [];

    let html = `<div class="card">
      <h3>اختيار الفصل الدراسـي</h3>
      <div style="display:flex;gap:6px;margin-bottom:8px">
        ${CFG.grades.map(g => `<button class="btn ${g.id===selectedGrade?'':'btn-d'}" onclick="selectedGrade='${g.id}';selectedClass=1;render()">${g.name}</button>`).join('')}
      </div>
      <div class="grid-chips">
        ${Array.from({length: gradeObj.count}, (_, i) => i + 1).map(c => `
          <div class="chip ${c===selectedClass?'sel':''}" onclick="selectedClass=${c};render()">فصل ${c}</div>
        `).join('')}
      </div>
    </div>`;

    html += `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h4>تحضير: ${gradeObj.name} / فصل ${selectedClass} (${stuList.length} طالب)</h4>
        ${!isTeacherAuth ? `<button class="btn btn-ok" onclick="verifyTeacherPass()">🔓 فتح شاشة التحضير</button>` : `<span style="color:green">✓ الشاشة مفعلة</span>`}
      </div>`;

    if (!isTeacherAuth) {
      html += `<p style="color:#64748b;margin-top:10px">يرجى الضغط على "فتح شاشة التحضير" وإدخال كلمة المرور لارسال الغياب إلى السحابة.</p>`;
    } else {
      if(stuList.length === 0) {
        html += `<p style="color:red;margin-top:10px">لا يوجد طلاب مضافون في هذا الفصل. (يرجى التأكد من رفع الإكسل من لوحة المدير أو المزامنة مع جداول جوجل).</p>`;
      }
      stuList.forEach((s, idx) => {
        const isAbs = absList.includes(s.id);
        html += `<div class="st-row ${isAbs?'abs':''}">
          <span><b>${idx+1}.</b> ${s.name}</span>
          <button class="btn ${isAbs?'btn-d':'btn-ok'}" onclick="toggleAbsence('${key}', '${s.id}')">
            ${isAbs ? 'غائـب' : 'حاضـر'}
          </button>
        </div>`;
      });
    }
    html += `</div>`;
    area.innerHTML = html;

  } else if (currentTab === 'rep') {
    let html = `<div class="card"><h3>التقرير اليومي لغياب المدرسة</h3><table>`;
    let totalAll = 0, absAll = 0;
    CFG.grades.forEach(g => {
      html += `<tr><td colspan="4" style="background:#f1f5f9;font-weight:bold">${g.name}</td></tr>`;
      for(let c=1; c<=g.count; c++) {
        const k = g.id + '_' + c;
        const stu = STU[k] || [];
        const abs = ABS[k] || [];
        totalAll += stu.length; absAll += abs.length;
        html += `<tr>
          <td>فصل ${c}</td>
          <td>العدد: ${stu.length}</td>
          <td>الغياب: <b style="color:red">${abs.length}</b></td>
          <td>النسبة: ${stu.length ? ((abs.length/stu.length)*100).toFixed(1)+'%' : '0%'}</td>
        </tr>`;
      }
    });
    html += `</table><hr><h4>إجمالي الغياب: ${absAll} من ${totalAll} (${totalAll?((absAll/totalAll)*100).toFixed(1)+'%':'0%'})</h4></div>`;
    area.innerHTML = html;

  } else if (currentTab === 'qr') {
    let html = `<div class="card no-print">
      <h3>أكواد QR الفصول</h3>
      <button class="btn" onclick="window.print()">🖨 طباعة البطاقات</button>
    </div><div style="display:flex;flex-wrap:wrap;gap:10px">`;

    const baseUrl = window.location.href.split('?')[0];
    CFG.grades.forEach(g => {
      for(let c=1; c<=g.count; c++) {
        const qrUrl = `${baseUrl}?g=${g.id}&c=${c}`;
        const qrId = `qr_${g.id}_${c}`;
        html += `<div class="qr-card">
          <b>${g.name}</b><br><small>فصل (${c})</small>
          <div id="${qrId}" style="margin:10px 0"></div>
        </div>`;
        setTimeout(() => {
          document.getElementById(qrId).innerHTML = "";
          new QRCode(document.getElementById(qrId), { text: qrUrl, width: 90, height: 90 });
        }, 100);
      }
    });
    html += `</div>`;
    area.innerHTML = html;

  } else if (currentTab === 'admin') {
    let html = `<div class="card">
      <h3>لوحة تحكم المدير وتحديد الربط السحابي</h3>
      <label>اسم المدرسة:</label>
      <input type="text" value="${CFG.school}" onchange="CFG.school=this.value;saveState()">
      
      <label>كلمة مرور المعلمين (OTP):</label>
      <input type="text" value="${CFG.teacherPass}" onchange="CFG.teacherPass=this.value;saveState()">

      <label>رابط Google Apps Script (الربط السحابي):</label>
      <input type="text" value="${CFG.gsUrl}" placeholder="https://script.google.com/macros/s/.../exec" onchange="CFG.gsUrl=this.value;saveState();fetchFromCloud();">

      <hr>
      <h4>رفع ملفات الإكسل إلى السحابة:</h4>
      <select id="import-grade-select">
        ${CFG.grades.map(g => `<option value="${g.id}">${g.name}</option>`).join('')}
      </select>
      <input type="file" accept=".xlsx, .xls" onchange="handleExcelUpload(this.files[0], document.getElementById('import-grade-select').value)">
    </div>`;
    area.innerHTML = html;
  }
}

initURLParams();
fetchFromCloud();
</script>
</body>
</html>
