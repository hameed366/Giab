<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إحصائية الغياب اليومي | الإصدار الاحترافي التجريبي</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--tx:#17243a;--mu:#64748b;--bd:#dce2eb;--pr:#c39a3d;--ab:#b94343;--ok:#16845b;--sel:#f6edda;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1423;--card:#131f33;--tx:#edf2fb;--mu:#a6b2c6;--bd:#293953;--pr:#d7b15b;--ab:#ff7777;--ok:#4dd6a0;--sel:#302b21;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1423;--card:#131f33;--tx:#edf2fb;--mu:#a6b2c6;--bd:#293953;--pr:#d7b15b;--ab:#ff7777;--ok:#4dd6a0;--sel:#302b21;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(520px 260px at 12% 0,rgba(195,154,61,.12),transparent),radial-gradient(460px 260px at 92% 8%,rgba(24,48,82,.10),transparent);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateY(24px) scale(1.06)}}
.w{max-width:900px;margin:0 auto;padding:12px}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:10px}.hd h1{margin:0}.hd img{width:58px;height:58px;object-fit:contain;border-radius:12px;background:#fff;box-shadow:0 0 14px rgba(124,77,255,.4)}
h1{font-size:22px;margin:6px 0 10px;color:var(--tx);font-weight:800;letter-spacing:-.3px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1}
button{position:relative;overflow:hidden;font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 12px;border-radius:12px;cursor:pointer;transition:transform .12s,box-shadow .18s,border-color .18s}
button::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);transform:translateX(120%);transition:transform .6s;pointer-events:none}
button:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(17,35,61,.10);border-color:var(--pr)}
button:hover::after{transform:translateX(-120%)}
button:active{transform:scale(.94)}
button.on,button.p{background:linear-gradient(135deg,#142b4b,#1c3d63);color:#fff;border-color:#c39a3d;box-shadow:0 4px 12px rgba(17,35,61,.18)}
button.d{color:var(--ab);border-color:var(--ab)}
button.d:hover{box-shadow:0 6px 16px rgba(217,58,58,.35),0 0 0 1px var(--ab);border-color:var(--ab)}
@keyframes flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
h1{animation-name:flow}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:13px;box-shadow:0 5px 20px rgba(20,38,64,.035)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
input,textarea{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px}
.seg{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.seg button{flex:1;min-width:70px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-bottom:10px}
.chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px}
.chip b{font-size:16px}.chip small{color:var(--mu);font-size:12px}
.chip.done small{color:var(--ok)}.chip.done.has small{color:var(--ab)}
.chip.sel{background:var(--sel);border-color:var(--pr);box-shadow:0 0 0 2px color-mix(in srgb,var(--pr) 20%,transparent)}
@keyframes glow{50%{box-shadow:0 0 16px rgba(124,77,255,.6)}}
.st{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--bd);border-radius:10px;margin-bottom:6px;width:100%;text-align:start}
.st.a{background:color-mix(in srgb,var(--ab) 14%,var(--card));border-color:var(--ab)}
.st i{font-style:normal;color:var(--mu);min-width:24px}
.st span.m{margin-inline-start:auto;font-weight:700;color:var(--ab)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.cards div{background:linear-gradient(160deg,var(--card),color-mix(in srgb,var(--sel) 26%,var(--card)));border:1px solid var(--bd);border-top:3px solid var(--pr);border-radius:13px;padding:12px;text-align:center}
.cards b{display:block;font-size:22px}.cards small{color:var(--mu)}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}
th{color:var(--mu);font-weight:600}tr.t td{font-weight:700;background:var(--sel)}
.names{color:var(--ab);font-size:14px;white-space:normal;text-align:start}
.mu{color:var(--mu);font-size:14px}
.row{display:flex;gap:6px;margin-bottom:6px}.row input{flex:1;min-width:0}
.msg{background:var(--sel);border:1px solid color-mix(in srgb,var(--pr) 35%,var(--bd));border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14px}
textarea{width:100%;min-height:90px}
.sp{position:fixed;pointer-events:none;z-index:99;font-size:15px;animation:pop .85s ease-out forwards}
@keyframes pop{to{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(200deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*,*::after,body::before{animation:none!important;transition:none!important}.sp{display:none}}
@media print{@page{size:A4;margin:12mm}.tabs,.bar,.noprint,button,input[type=date]{display:none!important}body{background:#fff!important;color:#000!important;font-size:11pt}body::before{display:none}.w{max-width:none;padding:0}.card{border:1px solid #ccd3dd;box-shadow:none;break-inside:avoid;background:#fff!important;color:#000!important}.cards div{background:#fff!important;color:#000!important}th,td{white-space:normal}.names{color:#8d2424!important}}
.chartrow{display:grid;grid-template-columns:minmax(90px,1fr) 3fr 54px;gap:10px;align-items:center;margin:9px 0;font-size:14px}.track{height:12px;background:color-mix(in srgb,var(--bd) 65%,transparent);border-radius:20px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#c39a3d,#e4ca84);border-radius:20px;min-width:0}.charttitle{font-weight:800;margin-bottom:10px}.statuspill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--sel);font-size:12px}
</style></head><body><div class="w">
<div class="hd"><img id="lg" alt="" hidden><div><h1 id="ttl">📋 إحصائية الغياب اليومي</h1><div class="mu" id="sub"></div></div></div>
<div class="tabs"><button id="t-entry" onclick="T='entry';R()">رصد الغياب</button><button id="t-rep" onclick="T='rep';R()">إحصائية اليوم</button><button id="t-man" onclick="T='man';R()" style="display:none">الإعدادات</button></div>
<div id="app"><div class="msg">جارٍ التحميل…</div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const GN={'السادس':6,'السابع':7,'الثامن':8,'التاسع':9},NUM=/^[\d٠-٩۰-۹.\s]+$/;
const DEFG=()=>({grades:[['g1','السادس',9],['g2','السابع',8],['g3','الثامن',8],['g4','التاسع',8]].map(a=>({id:a[0],name:a[1],count:a[2]})),locked:false});
let db=null,ready=false,isAdmin=false,canW=null,CFG=null,STU={},ABS={},unsubA=null,T='entry',G=null,K=null,D=td(),pend='',msg='',IMP=null,IS='all',dirty=0,conf={};
const WQ={},cfg=()=>CFG||DEFG(),busy=i=>WQ[i]&&(WQ[i].b||WQ[i].d),uid=()=>Math.random().toString(36).slice(2,9),nn=s=>String(s).replace(/\s+/g,' ').trim(),cl=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function td(){return fmt(new Date())}
function dlabel(){try{return new Date(D+'T12:00:00').toLocaleDateString('ar-KW',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}catch(e){return D}}
function pc(a,b){return b?(a/b*100).toFixed(1)+'%':'—'}
function gcur(){const gs=cfg().grades;return gs.find(g=>g.id==G)||gs[0]||null}
function gnm(id){const g=cfg().grades.find(x=>x.id==id);return g?g.name:''}
function wr(id,ref,get){const q=WQ[id]=WQ[id]||{b:0,d:0};q.d=1;if(q.b)return;q.b=1;(async()=>{try{while(q.d){q.d=0;await ref.set(get())}}catch(e){q.d=0;msg='تعذر الحفظ ('+(e.code||'خطأ')+')'+(e.code=='invalid_argument'?': لا تملك صلاحية التعديل':'')}q.b=0;R()})()}
function mut(f){if(!CFG)CFG=DEFG();f(CFG);wr('cfg',db.doc('config/main'),()=>CFG);R()}
function sw(k){wr('s'+k,db.doc('students/'+k),()=>({list:STU[k]||[]}))}
function setAbs(k,a){if(canW===false)return;const d=D;ABS[k]=a;wr('a'+d+k,db.doc('absence/'+d+'_'+k),()=>({date:d,key:k,ids:ABS[k]||[]}));R()}
function tg(id){const a=(ABS[K]||[]).slice(),i=a.indexOf(id);i>=0?a.splice(i,1):a.push(id);setAbs(K,a)}
function setD(v){D=v||td();K=null;subAbs();R()}
function sh(n){const d=new Date(D+'T12:00:00');d.setDate(d.getDate()+n);setD(fmt(d))}
function dr(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA/.test(a.tagName)&&a.type!=='date'){dirty=1;return}R()}
addEventListener('focusout',()=>{if(dirty){dirty=0;setTimeout(R,400)}});
const er=e=>{msg='خطأ في الاتصال: '+(e&&e.code||'');R()};
function subAbs(){if(unsubA)unsubA();ABS={};unsubA=db.collection('absence').where('date','==',D).onSnapshot(s=>{const m={};s.docs.forEach(d=>{const x=d.data();m[x.key]=(x.ids||[]).slice()});for(const k in ABS)if(busy('a'+D+k))m[k]=ABS[k];ABS=m;dr()},er)}
async function init(){try{db=await claude.use('db');const u=await claude.use('user');if(u){isAdmin=await u.canEdit();canW=await u.can('data.write')}}catch(e){db=null}
if(db){db.doc('config/main').onSnapshot(s=>{if(busy('cfg'))return;CFG=s.exists?cl(s.data()):null;dr()},er);
db.collection('students').onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]=cl(d.data().list||[])});for(const k in STU)if(busy('s'+k))m[k]=STU[k];STU=m;dr()},er);subAbs()}
ready=true;R()}
function stats(){const out=[];let tT=0,tA=0,rc=0,cc=0;cfg().grades.forEach(g=>{const rows=[];let gT=0,gA=0;for(let n=1;n<=g.count;n++){const k=g.id+'_'+n,L=STU[k]||[],r=ABS[k],ids=new Set(L.map(s=>s.id)),ab=(r||[]).filter(i=>ids.has(i)),names=L.filter(s=>ab.includes(s.id)).map(s=>s.name);rows.push({n,t:L.length,a:ab.length,names,done:!!r});gT+=L.length;gA+=ab.length;if(L.length){cc++;if(r)rc++}}out.push({g,rows,gT,gA});tT+=gT;tA+=gA});return{out,tT,tA,rc,cc}}
function repText(){const s=stats(),C=cfg();let t=(C.school?C.school+'\n':'')+'إحصائية الغياب – '+dlabel()+'\n';s.out.forEach(o=>{t+='\n'+o.g.name+': '+o.gA+' غائب من '+o.gT+'\n';o.rows.forEach(r=>{if(r.a)t+='  فصل '+r.n+' ('+r.a+'): '+r.names.join('، ')+'\n'})});return t+'\nالإجمالي: '+s.tA+' غائب من '+s.tT+' ('+pc(s.tA,s.tT)+')'+(C.principal?'\nمدير المدرسة: '+C.principal:'')}
function exportExcel(){if(!window.XLSX){msg='تعذر تحميل مكتبة Excel. تحقق من الاتصال بالإنترنت.';R();return}const s=stats(),C=cfg(),rows=[['إحصائية الغياب اليومي'],['المدرسة',C.school||''],['التاريخ',dlabel()],['المدير',C.principal||''],[],['الصف','الفصل','إجمالي الطلاب','عدد الغائبين','نسبة الغياب','الحالة','أسماء الغائبين']];s.out.forEach(o=>o.rows.forEach(r=>rows.push([o.g.name,r.n,r.t,r.a,pc(r.a,r.t),!r.t?'لا يوجد طلاب':r.done?'تم الرصد':'لم يُرصد',r.names.join('، ')])));rows.push([],['الإجمالي','',s.tT,s.tA,pc(s.tA,s.tT),'','']);const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:20},{wch:10},{wch:15},{wch:15},{wch:15},{wch:16},{wch:55}];ws['!views']=[{rightToLeft:true}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'إحصائية الغياب');XLSX.writeFile(wb,'إحصائية_الغياب_'+D+'.xlsx');msg='تم تجهيز ملف Excel';R()}
function cp(t){try{navigator.clipboard.writeText(t).then(()=>{msg='تم النسخ';R()},()=>fb(t))}catch(e){fb(t)}}
function fb(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');msg='تم النسخ'}catch(e){msg='تعذر النسخ'}a.remove();R()}
function seg(){const c=gcur();return'<div class="seg">'+cfg().grades.map(g=>`<button class="${c&&g.id==c.id?'on':''}" onclick="G='${g.id}';K=null;pend='';R()">${esc(g.name)}</button>`).join('')+'</div>'}
function vEntry(){const g=gcur();let h=`<div class="card"><div class="bar"><button onclick="sh(-1)">اليوم السابق</button><input type="date" value="${D}" onchange="setD(this.value)"><button onclick="sh(1)">اليوم التالي</button><button onclick="setD(td())">اليوم</button></div><div class="mu">${dlabel()}</div></div><div class="card">`;
if(!g)return h+'<div class="mu">لا توجد صفوف بعد. يضيفها المدير من الإعدادات.</div></div>';
if(canW===false)h+='<div class="msg">صلاحيتك عرض فقط، لا يمكنك رصد الغياب.</div>';
h+=seg()+'<div class="chips">';
for(let n=1;n<=g.count;n++){const k=g.id+'_'+n,L=STU[k]||[],r=ABS[k],ids=new Set(L.map(s=>s.id)),c=r?r.filter(i=>ids.has(i)).length:0;h+=`<button class="chip ${r?'done':''} ${c?'has':''} ${K==k?'sel':''}" onclick="K='${k}';R()"><b>فصل ${n}</b><small>${r?(c?c+' غائب':'✓ لا غياب'):(L.length?'لم يُرصد':'بلا طلاب')}</small></button>`}
h+='</div>';
if(K&&K.startsWith(g.id+'_')){const L=STU[K]||[],r=ABS[K]||[];h+=`<div class="bar"><b>${esc(g.name)} / ${K.split('_')[1]}</b><span class="mu">${L.length} طالب</span><span style="flex:1"></span><button onclick="setAbs(K,[])">لا يوجد غياب</button></div>`;
if(!L.length)h+='<div class="msg">لا يوجد طلاب في هذا الفصل. يضيفهم المدير من الإعدادات.</div>';
L.forEach((s,i)=>{const a=r.includes(s.id);h+=`<button class="st ${a?'a':''}" onclick="tg('${s.id}')"><i>${i+1}</i>${esc(s.name)}${a?'<span class="m">غائب</span>':''}</button>`})}
else h+='<div class="mu">اختر الفصل لرصد الغياب.</div>';
return h+'</div>'}
function vRep(){const s=stats();let h=`<div class="card"><div class="bar noprint"><button onclick="sh(-1)">اليوم السابق</button><input type="date" value="${D}" onchange="setD(this.value)"><button onclick="sh(1)">اليوم التالي</button></div><b>${dlabel()}</b></div>`;
h+=`<div class="cards"><div><b>${s.tT}</b><small>إجمالي الطلاب</small></div><div><b style="color:var(--ab)">${s.tA}</b><small>الغائبون</small></div><div><b>${pc(s.tA,s.tT)}</b><small>نسبة الغياب</small></div><div><b>${s.rc}/${s.cc}</b><small>فصول تم رصدها</small></div></div>`;
 h+=`<div class="card"><div class="charttitle">مقارنة الغياب حسب الصف</div>${s.out.map(o=>`<div class="chartrow"><span>${esc(o.g.name)}</span><div class="track"><div class="fill" style="width:${o.gT?Math.min(100,o.gA/o.gT*100):0}%"></div></div><b>${pc(o.gA,o.gT)}</b></div>`).join('')}<div class="mu">النسب محسوبة من إجمالي الطلاب المسجلين في كل صف.</div></div>`;
s.out.forEach(o=>{h+=`<div class="card"><b>${esc(o.g.name)}</b><div class="sc"><table><tr><th>الفصل</th><th>الطلاب</th><th>الغياب</th><th>النسبة</th><th>الحالة</th></tr>`;
o.rows.forEach(r=>{h+=`<tr><td>${r.n}</td><td>${r.t}</td><td>${r.a}</td><td>${pc(r.a,r.t)}</td><td>${!r.t?'—':r.done?'✓':'لم يُرصد'}</td></tr>`;if(r.a)h+=`<tr><td colspan="5" class="names">${r.names.map(esc).join('، ')}</td></tr>`});
h+=`<tr class="t"><td>المجموع</td><td>${o.gT}</td><td>${o.gA}</td><td>${pc(o.gA,o.gT)}</td><td></td></tr></table></div></div>`});
return h+(cfg().principal?`<div class="card">مدير المدرسة: <b>${esc(cfg().principal)}</b></div>`:'')+'<div class="bar noprint"><button class="p" onclick="cp(repText())">نسخ التقرير (للواتساب)</button><button onclick="exportExcel()">تصدير Excel</button><button onclick="window.print()">طباعة / PDF</button></div>'}
function gn(i,v){if(nn(v))mut(c=>{c.grades[i].name=nn(v)})}
function gc(i,d){const g=cfg().grades[i];if(d<0&&g.count&&(STU[g.id+'_'+g.count]||[]).length&&pend!=='c'+i){pend='c'+i;msg='الفصل الأخير فيه طلاب. اضغط (−) مرة أخرى للتأكيد.';R();return}pend='';mut(c=>{const x=c.grades[i];x.count=Math.max(0,Math.min(30,x.count+d))})}
function gd(i){if(pend!=='g'+i){pend='g'+i;R();return}pend='';K=null;mut(c=>{c.grades.splice(i,1)})}
function ga(){mut(c=>{c.grades.push({id:'g'+Date.now().toString(36),name:'صف جديد',count:1})})}
function lock(){pend='';mut(c=>{c.locked=!c.locked})}
function addSt(){const t=document.getElementById('nw').value.split('\n').map(nn).filter(Boolean);if(!K||!t.length)return;STU[K]=(STU[K]||[]).concat(t.map(n=>({id:uid(),name:n})));msg='تمت إضافة '+t.length+' طالب';sw(K);R()}
function rn(id,v){const s=(STU[K]||[]).find(x=>x.id==id);if(s&&nn(v)){s.name=nn(v);sw(K)}}
function dl(id){if(pend!=='s'+id){pend='s'+id;R();return}pend='';STU[K]=(STU[K]||[]).filter(x=>x.id!=id);sw(K);R()}
function srt(){STU[K]=(STU[K]||[]).slice().sort((a,b)=>a.name.localeCompare(b.name,'ar'));sw(K);R()}
function nd(s){return String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))}
function gfind(v){v=nn(nd(v||'')).replace(/الصف/g,'').trim();if(!v)return null;const gs=cfg().grades;const g=gs.find(x=>{const t=nd(x.name).replace(/الصف/g,'').trim();return t&&(v.includes(t)||t.includes(v))});if(g)return g;const m=v.match(/\d+/);if(m){const w=Object.keys(GN).find(k=>GN[k]==+m[0]);if(w)return gs.find(x=>x.name.includes(w))||null}return null}
function pcls(gv,cv,hasG){const t=nd(cv||''),ns=t.match(/\d+/g)||[];let g=hasG?gfind(gv):null;if(!g)g=gfind(t.replace(/\d+/g,' '));if(!g&&ns.length>1)g=gfind(ns[0]);return[g,ns.length?+ns[ns.length-1]:0]}
function rd(f){if(!f)return;if(!window.XLSX){msg='تعذر تحميل مكتبة الإكسل، تأكد من الاتصال بالإنترنت';R();return}
const fr=new FileReader(),csv=/\.csv$/i.test(f.name);
fr.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:csv?'string':'array'}),map={};let skip=0;
wb.SheetNames.forEach(sn=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''}).filter(r=>r.some(c=>String(c).trim()));if(!rows.length)return;

if(IS=='grade')g=gc0}

function applyImp(){let n=0;const ks=Object.keys(IMP.map),m=IMP.map;IMP=null;mut(c=>{ks.forEach(k=>{const p=k.split('_'),g=c.grades.find(x=>x.id==p[0]);if(g&&+p[1]>g.count)g.count=+p[1];STU[k]=(STU[k]||[]).concat(m[k].nw.map(nm=>({id:uid(),name:nm})));n+=m[k].nw.length;sw(k)})});msg='تم استيراد '+n+' طالب'}
function impCard(){const g=gcur(),hp={all:'ملف للمدرسة كلها: أعمدة «الصف» و«الفصل» و«الاسم» (اسم الصف يطابق الإعدادات والفصل رقم)، أو اجعل اسم كل ورقة مثل «السادس 1».',grade:'ملف لصف واحد فيه كل فصوله: عمود «الفصل» (رقم) و«الاسم»، أو ورقة لكل فصل باسم الورقة رقم الفصل (مثل 1، 2، 3).',class:'ملف أسماء لفصل واحد: عمود واحد للأسماء أو عمود «الاسم»، ويُضاف كله إلى الفصل المختار.'}[IS],sel=IS=='grade'?'الصف المختار: '+(g?g.name:'—'):IS=='class'?(K&&g&&K.startsWith(g.id+'_')?'الفصل المختار: '+g.name+' / '+K.split('_')[1]:'اختر الفصل من الأعلى أولًا'):'';

if(IMP){const ks=Object.keys(IMP.map).sort(),tot=ks.reduce((a,k)=>a+IMP.map[k].nw.length,0);
h+=ks.length?`<div class="sc" style="margin-top:8px"><table><tr><th>الفصل</th><th>سيضاف</th><th>مكرر</th></tr>${ks.map(k=>`<tr><td>${esc(gnm(k.split('_')[0]))} / ${k.split('_')[1]}</td><td>${IMP.map[k].nw.length}</td><td>${IMP.map[k].dup}</td></tr>`).join('')}</table></div><div class="mu" style="margin:6px 0">الإجمالي: ${tot} طالب${IMP.skip?' — تم تجاهل '+IMP.skip+' صفًا غير صالح':''}</div><div class="bar"><button class="p" onclick="applyImp()">تأكيد الاستيراد</button><button onclick="IMP=null;R()">إلغاء</button></div>`:'<div class="msg" style="margin-top:8px">لم يُعثر على أسماء صالحة لهذا الخيار. راجع شرح الخيار المختار أعلاه.</div>'}

function lg(f){if(!f)return;const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const s=Math.min(1,200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);let u=c.toDataURL('image/png');if(u.length>150000){const x=c.getContext('2d');x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);u=c.toDataURL('image/jpeg',.8)}mut(x=>{x.logo=u})};im.onerror=()=>{msg='تعذر قراءة الصورة';R()};im.src=e.target.result};r.readAsDataURL(f)}
function schoolCard(){const C=cfg();return `<div class="card"><b>بيانات المدرسة</b><div style="height:8px"></div><div class="row"><input placeholder="اسم المدرسة" value="${esc(C.school||'')}" onchange="sf('school',this.value)"></div><div class="row"><input placeholder="اسم المدير" value="${esc(C.principal||'')}" onchange="sf('principal',this.value)"></div><div class="bar">${C.logo?`<img src="${C.logo}" alt="" style="width:48px;height:48px;object-fit:contain;border-radius:10px;background:#fff">`:''}<input type="file" accept="image/*" onchange="lg(this.files[0])">${C.logo?`<button class="d" onclick="sf('logo','')">إزالة الشعار</button>`:''}</div></div>`}
function vMan(){const C=cfg(),lk=C.locked;let h=`<div class="card"><div class="bar"><button class="${lk?'p':''}" onclick="lock()">${lk?'🔒 الإعدادات مقفلة — اضغط للفتح':'🔓 قفل الإعدادات'}</button></div><div class="mu">${lk?'لا يمكن تعديل الصفوف أو الطلاب أثناء القفل. رصد الغياب يعمل بشكل طبيعي.':'بعد الانتهاء من الإعداد اقفل الإعدادات حتى لا تتغير بالخطأ.'}</div></div>`;

else h+='<div class="mu">اختر فصلًا لإضافة الطلاب وتعديلهم.</div>';
return h+'</div>'+impCard()}
